<!-- ===== PATCH: iPhone-Speichern über Teilen-Menü (23.11.2026) =====
     Diesen ganzen Block direkt VOR der Zeile </body> einfügen.
     Er ersetzt die Funktion exportJSON() und merkt sich den Dateinamen. -->
<script>
    function isTouchDevice() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function getExportFileName() {
        var remembered = '';
        try { remembered = localStorage.getItem('kowi_tresor_filename') || ''; } catch (e) {}
        return connectedFileName || remembered ||
            ('kowis_whisky_tresor_' + new Date().toISOString().split('T')[0] + '.json');
    }

    function downloadJSON(jsonStr, fileName) {
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    /* Neu: Auf iPhone/iPad direkt das Teilen-Menü öffnen ("In Dateien sichern"),
       am Rechner wie bisher herunterladen. */
    window.exportJSON = function() {
        var jsonStr = JSON.stringify(whiskeys, null, 2);
        var fileName = getExportFileName();

        if (isTouchDevice() && navigator.share && window.File) {
            var file = new File([jsonStr], fileName, { type: 'application/json' });
            if (!navigator.canShare || navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file] }).catch(function(err) {
                    if (err && err.name === 'AbortError') return; // Nutzer hat abgebrochen
                    downloadJSON(jsonStr, fileName);
                });
                return;
            }
        }
        downloadJSON(jsonStr, fileName);
    };

    /* Dateinamen merken, damit beim Speichern "Ersetzen" angeboten wird */
    var originalHandleIosJsonSelected = handleIosJsonSelected;
    window.handleIosJsonSelected = function(event) {
        var file = event.target.files && event.target.files[0];
        if (file) {
            try { localStorage.setItem('kowi_tresor_filename', file.name); } catch (e) {}
        }
        return originalHandleIosJsonSelected(event);
    };

    /* Nach dem Neuladen: Dateinamen wiederherstellen und Speichern-Leiste zeigen */
    window.addEventListener('DOMContentLoaded', function() {
        var remembered = '';
        try { remembered = localStorage.getItem('kowi_tresor_filename') || ''; } catch (e) {}
        if (remembered && !connectedFileName) {
            connectedFileName = remembered;
            document.getElementById('syncStatusText').textContent =
                'Zuletzt geladen aus: ' + remembered + ' (' + whiskeys.length + ' Flaschen)';
            document.getElementById('syncBanner').classList.remove('hidden');
        }
    });
</script>
